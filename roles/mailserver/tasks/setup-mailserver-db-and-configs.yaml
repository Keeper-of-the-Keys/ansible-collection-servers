- name: Generate random password
  become: no
  ansible.builtin.set_fact:
    mailserver_dovecot_password_readonly: "{{ lookup('community.general.random_string', length=40, override_special=special_list) }}"
    mailserver_postfix_password_readonly: "{{ lookup('community.general.random_string', length=40, override_special=special_list) }}"
  vars:
    special_list: '-_=+()[]{},./?!@#$^~:'

- name: Create mailserver db
  become: yes
  community.mysql.mysql_db:
    name: '{{ mailserver_db_name }}'
    login_unix_socket: /var/run/mysqld/mysqld.sock
    state: present
  register: database_created

# At this time requires my branch of community.mysql, should be merged in 3.13.0
# This user needs to exist before the db is imported or schema upgrades are run since otherwise stored procedure creation will fail.
- name: Create user for stored procedures
  become: true
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: mailserver_ro_procedures
    priv: '{{ mailserver_db_name }}.*:SELECT'
    locked: true

- name: Import database schema
  ansible.builtin.include_tasks: tasks/setup-mailserver-db.yaml
  when: database_created is changed

- name: Determine schema version
  become: yes
  community.mysql.mysql_query:
    login_db: '{{ mailserver_db_name }}'
    query: SELECT `value` FROM `system_info` WHERE `key` = 'schema_version';
    login_unix_socket: /run/mysqld/mysqld.sock
  register: schema_version
  when: database_created is not changed

- name: Schema version upgrade
  ansible.builtin.include_tasks: tasks/db-schema-upgrade-loop.yaml
  when:
  - database_created is not changed
  - schema_version is succeeded
  - schema_version.rowcount[0] == 1
  - schema_version.query_result[0][0]['value'] | int < mailserver_db_schema_current | int
  - mailserver_db_migrations[schema_version.query_result[0][0]['value']] is defined

- name: Populate database
  ansible.builtin.include_tasks: tasks/db-mailserver-populate.yaml
  when: database_created is changed or mailserver_ansible_source_of_truth is not defined or mailserver_ansible_source_of_truth

# TODO/TBD: dovecot and postfix users?
# Postfix read only, no password hashes, only procedures?
# Dovecot/lua yes password hashes

# After the schema is imported/updated the procdures exist and can be granted, as procedures may be dropped during updates and with it the rights this needs to run like this after the fact.
- name: Create user for stored procedures
  become: true
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: mailserver_ro_procedures
    priv: '{{ mailserver_db_name }}.*:SELECT/PROCEDURE {{ mailserver_db_name }}.dovecot_auth_domain_config:EXECUTE/PROCEDURE {{ mailserver_db_name }}.dovecot_auth_user_details:EXECUTE/PROCEDURE {{ mailserver_db_name }}.dovecot_auth_resolve_alias:EXECUTE/PROCEDURE {{ mailserver_db_name }}.dovecot_auth_primary_user:EXECUTE/PROCEDURE {{ mailserver_db_name }}.postfix_resolve_alias:EXECUTE/PROCEDURE {{ mailserver_db_name }}.postfix_sender_maps:EXECUTE/PROCEDURE {{ mailserver_db_name }}.postfix_virtual_mailbox_domains:EXECUTE/PROCEDURE {{ mailserver_db_name }}.postfix_virtual_mailbox_maps:EXECUTE'
    locked: true

- name: Create dovecot mysql user or cycle password
  become: yes
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: '{{ mailserver_dovecot_user_readonly }}'
    password: '{{ mailserver_dovecot_password_readonly }}'
    priv:
      '{{ mailserver_db_name }}.virtual_application_password_log:INSERT/PROCEDURE {{ mailserver_db_name }}.dovecot_auth_domain_config:EXECUTE/PROCEDURE {{ mailserver_db_name }}.dovecot_auth_user_details:EXECUTE/PROCEDURE {{ mailserver_db_name }}.dovecot_auth_resolve_alias:EXECUTE/PROCEDURE {{ mailserver_db_name }}.dovecot_auth_primary_user:EXECUTE'
    state: present

- name: Create postfix mysql user or cycle password
  become: yes
  community.mysql.mysql_user:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    name: '{{ mailserver_postfix_user_readonly }}'
    password: '{{ mailserver_postfix_password_readonly }}'
    priv:
      'PROCEDURE {{ mailserver_db_name }}.postfix_resolve_alias:EXECUTE/PROCEDURE {{ mailserver_db_name }}.postfix_sender_maps:EXECUTE/PROCEDURE {{ mailserver_db_name }}.postfix_virtual_mailbox_domains:EXECUTE/PROCEDURE {{ mailserver_db_name }}.postfix_virtual_mailbox_maps:EXECUTE'
    state: present

- name: Copy postfix configs
  become: yes
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    mode: '0640'
    owner: root
    group: postfix
  notify: restart_postfix
  loop:
  - src: postfix.main.cf.j2
    dest: /etc/postfix/main.cf
  - src: postfix.master.cf.j2
    dest: /etc/postfix/master.cf
  - src: mysql-virtual-alias-maps.cf.j2
    dest: /etc/postfix/mysql-virtual-alias-maps.cf
  - src: mysql-virtual-mailbox-domains.cf.j2
    dest: /etc/postfix/mysql-virtual-mailbox-domains.cf
  - src: mysql-virtual-mailbox-maps.cf.j2
    dest: /etc/postfix/mysql-virtual-mailbox-maps.cf
  - src: mysql-virtual-sender-maps.cf.j2
    dest: /etc/postfix/mysql-virtual-sender-maps.cf

- name: Copy dovecot configs
  become: yes
  ansible.builtin.template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    mode: '0640'
    owner: root
    group: dovecot
  notify: restart_dovecot
  loop:
  - src: dovecot-auth-lua.j2
    dest: /etc/dovecot/dovecot-auth.lua
