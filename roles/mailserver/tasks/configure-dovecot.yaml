- name: Modify dovecot configuarion blocks
  become: yes
  ansible.builtin.replace:
    path: '{{ item.path }}'
    regexp: '{{ item.regexp }}'
    replace: '{{ item.replace }}'
  with_items:
  - path: /etc/dovecot/conf.d/10-master.conf
    regexp: '^(service lmtp {)\n(  unix_listener lmtp {\n    #mode = 0666\n  })'
    replace: '\1\n  unix_listener /var/spool/postfix/private/dovecot-lmtp {\n    mode = 0600\n    group = postfix\n    user = postfix\n  }'
  - path: /etc/dovecot/conf.d/10-master.conf
    regexp: '^  #(unix_listener /var/spool/postfix/private/auth {)\n^  #(  mode = 0666)\n^  #(})'
    replace: '  \1\n  \2\n  \3'
  - path: /etc/dovecot/conf.d/15-mailboxes.conf
    regexp: '(  mailbox Drafts {)\n(    special_use = \\Drafts)\n(  })'
    replace: '\1\n    auto = subscribe\n\2\n\3'
  - path: /etc/dovecot/conf.d/15-mailboxes.conf
    regexp: '(  mailbox Sent {)\n(    special_use = \\Sent)\n(  })'
    replace: '\1\n    auto = subscribe\n\2\n\3'
  - path: /etc/dovecot/conf.d/15-mailboxes.conf
    regexp: '(  mailbox Junk {)\n(    special_use = \\Junk)\n(  })'
    replace: '\1\n    auto = subscribe\n\2\n\3'
  - path: /etc/dovecot/conf.d/15-mailboxes.conf
    regexp: '(  mailbox Trash {)\n(    special_use = \\Trash)\n(  })'
    replace: '\1\n    auto = subscribe\n\2\n\3'
